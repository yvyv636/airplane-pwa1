<html lang="zh-CN">
<head>
  <!-- 3D engine: three.js r180, MIT License, Copyright © 2010-2025 three.js authors -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="圆滚滚喷气机：纯白摄影棚里的实时 3D 飞行小飞机，可转向、加速、换涂装，并带有夜间灯光。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jet Rond">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Jet Rond · 圆滚滚喷气机</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

  <script>
    try {
      if (localStorage.getItem('jetrond.night') === '1') {
        document.documentElement.classList.add('night');
      }
    } catch (error) { /* private mode */ }
  </script>
  <style>/* =========================================================
   JET ROND — mobile flight-deck app
   Pure white studio by day, runway lights by night.
   ========================================================= */

:root {
  --bg: #ffffff;
  --ink: #20353b;
  --ink-2: #6f8081;
  --ink-3: rgba(32, 53, 59, 0.44);
  --line: rgba(32, 53, 59, 0.15);
  --line-strong: rgba(32, 53, 59, 0.28);
  --surface: rgba(255, 255, 255, 0.82);
  --surface-solid: #fffaf1;
  --control: #f8f2e7;
  --livery: #e8745b;
  --livery-soft: rgba(232, 116, 91, 0.16);
  --shadow: 0 14px 38px rgba(28, 46, 50, 0.12), 0 2px 7px rgba(28, 46, 50, 0.06);
  --shadow-tight: 0 5px 16px rgba(28, 46, 50, 0.09);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --ui-font: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  --serif: "Bodoni MT", "Didot", "Georgia", "Times New Roman", serif;
  --mono: "Bahnschrift", "DIN Alternate", "Arial Narrow", "Arial", sans-serif;
  color-scheme: light;
}

html.night {
  --bg: #071017;
  --ink: #e8efef;
  --ink-2: #92a5a7;
  --ink-3: rgba(232, 239, 239, 0.46);
  --line: rgba(221, 241, 241, 0.15);
  --line-strong: rgba(221, 241, 241, 0.28);
  --surface: rgba(13, 24, 31, 0.82);
  --surface-solid: #0e1921;
  --control: #14232c;
  --shadow: 0 18px 46px rgba(0, 0, 0, 0.4), 0 2px 7px rgba(0, 0, 0, 0.25);
  --shadow-tight: 0 6px 20px rgba(0, 0, 0, 0.32);
  --livery-soft: rgba(111, 160, 170, 0.22);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  position: relative;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui-font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
  touch-action: none;
  transition: background-color 0.55s ease, color 0.35s ease;
}

button {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 2px solid var(--livery);
  outline-offset: 3px;
}

.app-shell {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
}

#scene {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}

#scene:active { cursor: grabbing; }

.ambient-vignette {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  background:
    radial-gradient(ellipse at 50% 38%, rgba(22, 42, 53, 0) 35%, rgba(1, 6, 10, 0.3) 72%, rgba(0, 3, 6, 0.58) 100%),
    radial-gradient(circle at 76% 18%, rgba(100, 147, 162, 0.12), transparent 34%);
  transition: opacity 0.7s ease;
}

html.night .ambient-vignette { opacity: 1; }

.ui-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.ui-layer button { pointer-events: auto; }

/* ---------- Header ---------- */

.app-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding:
    calc(18px + var(--safe-top))
    calc(22px + var(--safe-right))
    0
    calc(24px + var(--safe-left));
  animation: drop-in 0.8s 0.15s both cubic-bezier(0.2, 0.7, 0.2, 1);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.brand-mark {
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  filter: drop-shadow(0 4px 8px rgba(32, 53, 59, 0.14));
}

.brand-mark svg {
  display: block;
  width: 100%;
  height: 100%;
}

.brand-copy {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.brand-kicker {
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.16em;
  line-height: 1;
  text-transform: uppercase;
  white-space: nowrap;
}

.brand h1 {
  margin: 0;
  color: var(--ink);
  font-family: var(--ui-font);
  font-size: clamp(19px, 2.1vw, 27px);
  font-weight: 900;
  letter-spacing: 0.02em;
  line-height: 1;
  white-space: nowrap;
}

.toolbar {
  display: flex;
  align-items: stretch;
  gap: 7px;
  flex: 0 0 auto;
}

.tool-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: 43px;
  height: 43px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
  box-shadow: var(--shadow-tight);
  color: var(--ink-2);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition:
    color 0.2s ease,
    background 0.2s ease,
    border-color 0.2s ease,
    transform 0.16s ease,
    box-shadow 0.2s ease;
}

.tool-btn svg {
  width: 18px;
  height: 18px;
  overflow: visible;
}

.tool-btn:hover {
  color: var(--ink);
  border-color: var(--line-strong);
  transform: translateY(-1px);
}

.tool-btn:active { transform: translateY(1px); }

.tool-btn.active,
.tool-btn[aria-pressed="true"] {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

.view-tool {
  width: 55px;
  gap: 1px;
}

.view-tool svg { width: 17px; height: 17px; }

.view-tool span {
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1;
  transition: color 0.2s ease;
}

.view-tool:hover span { color: var(--ink); }

.palette-tool { width: 43px; }

.palette-orb {
  display: block;
  width: 20px;
  height: 20px;
  border: 2px solid var(--surface-solid);
  border-radius: 50%;
  background:
    conic-gradient(
      from 210deg,
      var(--swatch-body, #f2d3a2) 0deg 110deg,
      var(--swatch-accent, #cf785b) 110deg 235deg,
      var(--swatch-detail, #f8e8c4) 235deg 360deg
    );
  box-shadow: 0 0 0 1px var(--line-strong), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
}

.theme-tool .icon-moon { display: none; }
html.night .theme-tool .icon-sun { display: none; }
html.night .theme-tool .icon-moon { display: block; }

/* ---------- Left vertical stage label ---------- */

.stage-label {
  position: absolute;
  left: calc(28px + var(--safe-left));
  top: 50%;
  display: flex;
  align-items: center;
  gap: 8px;
  transform: translateY(-50%) rotate(180deg);
  writing-mode: vertical-rl;
  color: var(--ink-3);
  font-family: var(--serif);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  animation: fade-in 1s 0.75s both ease;
}

.stage-label span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--livery);
}

.stage-label b { font-weight: 700; }
.stage-label em {
  margin-top: 2px;
  font-family: var(--ui-font);
  font-size: 8px;
  font-style: normal;
  letter-spacing: 0.16em;
  opacity: 0.65;
}

/* ---------- Flight controls ---------- */

.flight-ui {
  position: absolute;
  left: 50%;
  bottom: calc(16px + var(--safe-bottom));
  width: min(880px, calc(100% - 40px - var(--safe-left) - var(--safe-right)));
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  animation: deck-in 0.9s 0.3s both cubic-bezier(0.2, 0.7, 0.2, 1);
}

.keyboard-hint {
  margin: 0;
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--surface);
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.1em;
  line-height: 1.2;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: opacity 0.4s ease;
}

.flight-deck {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 24px;
  width: 100%;
  padding: 11px 15px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.deck-cluster {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.throttle-cluster { align-items: flex-end; }

.deck-heading {
  display: flex;
  align-items: baseline;
  gap: 7px;
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.15em;
  line-height: 1;
  text-transform: uppercase;
}

.deck-heading b {
  color: var(--ink);
  font-family: var(--ui-font);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.pad-pair {
  display: flex;
  gap: 7px;
}

.pad-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 57px;
  height: 54px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--control);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.65),
    0 2px 0 rgba(32, 53, 59, 0.06);
  color: var(--ink);
  transition:
    background 0.16s ease,
    color 0.16s ease,
    border-color 0.16s ease,
    transform 0.1s ease,
    box-shadow 0.16s ease;
}

html.night .pad-btn {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.05),
    0 2px 0 rgba(0, 0, 0, 0.25);
}

.pad-btn svg {
  width: 22px;
  height: 22px;
}

.pad-btn span {
  color: var(--ink-2);
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
}

.pad-btn.active {
  background: var(--livery);
  border-color: var(--livery);
  color: #fffaf1;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--livery) 65%, #263a40);
  transform: translateY(1px);
}

.pad-btn.active span { color: rgba(255, 250, 241, 0.8); }

.throttle-btn {
  flex-direction: column;
  gap: 1px;
}

.throttle-btn .plus,
.throttle-btn .minus {
  color: var(--ink);
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 500;
  line-height: 0.9;
}

.throttle-btn span:last-child {
  color: var(--ink-2);
  font-size: 8px;
  font-weight: 700;
}

.throttle-btn.active .plus,
.throttle-btn.active .minus { color: #fffaf1; }
.throttle-btn.active span:last-child { color: rgba(255, 250, 241, 0.8); }

/* ---------- Center flight data ---------- */

.speed-panel {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 184px;
  padding: 0 7px;
  text-align: center;
}

.speed-label {
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 7px;
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.16em;
  line-height: 1;
  text-transform: uppercase;
}

.speed-label span:last-child {
  color: var(--ink-3);
  font-family: var(--ui-font);
  font-size: 8px;
  letter-spacing: 0.08em;
}

.speed-readout {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 5px;
  margin: 1px 0 0;
}

.speed-readout strong {
  color: var(--ink);
  font-family: var(--mono);
  font-size: 37px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
  line-height: 0.92;
}

.speed-readout em {
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 7px;
  font-style: normal;
  font-weight: 700;
  letter-spacing: 0.09em;
}

.throttle-line {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 1px;
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 6px;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.throttle-line span { flex: 0 0 auto; }
.throttle-line b {
  min-width: 27px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 500;
  letter-spacing: 0;
  text-align: right;
}

.throttle-track {
  position: relative;
  flex: 1;
  height: 5px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: color-mix(in srgb, var(--ink) 7%, transparent);
}

.throttle-track i {
  display: block;
  width: 8%;
  height: 100%;
  border-radius: inherit;
  background: var(--livery);
  transition: width 0.12s linear;
}

.bank-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 1px;
  color: var(--ink-3);
  font-family: var(--serif);
  font-size: 6px;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.bank-line b {
  font-family: var(--ui-font);
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.bank-track {
  position: relative;
  width: 46px;
  height: 16px;
}

.bank-track::before {
  content: "";
  position: absolute;
  left: 5px;
  right: 5px;
  top: 50%;
  height: 1px;
  background: var(--line-strong);
}

.bank-track::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 2px;
  height: 5px;
  border-radius: 1px;
  background: var(--ink-3);
  transform: translate(-50%, -50%);
}

#rollNeedle {
  position: absolute;
  left: 50%;
  top: 50%;
  display: block;
  width: 19px;
  height: 2px;
  border-radius: 2px;
  background: var(--livery);
  transform: translate(-50%, -50%) rotate(0deg);
  transform-origin: 50% 50%;
  transition: transform 0.08s linear;
}

/* ---------- Livery sheet ---------- */

.sheet-scrim {
  position: absolute;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  opacity: 0;
  background: rgba(8, 16, 20, 0.28);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  transition: opacity 0.3s ease;
}

.sheet-scrim.open {
  pointer-events: auto;
  opacity: 1;
}

html.night .sheet-scrim { background: rgba(0, 0, 0, 0.55); }

.livery-sheet {
  position: absolute;
  left: 50%;
  bottom: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(540px, calc(100% - 20px));
  max-height: min(70vh, 560px);
  padding: 10px 20px calc(18px + var(--safe-bottom));
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 26px 26px 0 0;
  background: var(--surface-solid);
  box-shadow: 0 -18px 50px rgba(20, 32, 36, 0.18);
  transform: translate(-50%, calc(100% + 32px));
  transition: transform 0.42s cubic-bezier(0.22, 0.8, 0.22, 1);
  pointer-events: none;
}

html.night .livery-sheet { box-shadow: 0 -18px 50px rgba(0, 0, 0, 0.5); }

.livery-sheet.open {
  transform: translate(-50%, 0);
  pointer-events: auto;
}

.sheet-handle {
  width: 36px;
  height: 4px;
  margin: 0 auto 1px;
  border-radius: 99px;
  background: var(--line-strong);
}

.sheet-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

.sheet-kicker {
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.sheet-header h2 {
  margin: 4px 0 0;
  color: var(--ink);
  font-family: var(--ui-font);
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.02em;
  line-height: 1.1;
}

.sheet-close {
  min-width: 54px;
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--control);
  color: var(--ink-2);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.livery-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 1px;
}

.livery-option {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 63px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--control);
  color: var(--ink);
  text-align: left;
  transition:
    border-color 0.18s ease,
    background 0.18s ease,
    transform 0.16s ease;
}

.livery-option:hover { transform: translateY(-1px); }

.livery-option.active {
  border-color: var(--livery);
  background: var(--livery-soft);
}

.livery-copy {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.livery-copy b {
  font-size: 11px;
  font-weight: 700;
  line-height: 1.1;
}

.livery-copy em {
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 7px;
  font-style: normal;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.livery-chips {
  display: flex;
  flex-direction: row-reverse;
  flex: 0 0 auto;
}

.livery-chips i {
  display: block;
  width: 15px;
  height: 15px;
  margin-left: -5px;
  border: 2px solid var(--surface-solid);
  border-radius: 50%;
}

.livery-check {
  position: absolute;
  top: 6px;
  right: 7px;
  display: grid;
  width: 17px;
  height: 17px;
  place-items: center;
  border-radius: 50%;
  background: var(--livery);
  color: #fffaf1;
  font-family: var(--ui-font);
  font-size: 9px;
  font-weight: 700;
  opacity: 0;
  transform: scale(0.7);
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.livery-option.active .livery-check {
  opacity: 1;
  transform: scale(1);
}

.sheet-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 4px;
  border-top: 1px dashed var(--line);
}

.sheet-footer p {
  margin: 0;
  color: var(--ink-2);
  font-size: 9px;
  line-height: 1.5;
}

.install-btn {
  flex: 0 0 auto;
  height: 32px;
  padding: 0 13px;
  border: 1px solid var(--line-strong);
  border-radius: 99px;
  background: var(--ink);
  color: var(--bg);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

/* ---------- Toast ---------- */

.toast {
  position: absolute;
  left: 50%;
  top: calc(78px + var(--safe-top));
  z-index: 55;
  padding: 8px 13px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--surface);
  box-shadow: var(--shadow-tight);
  color: var(--ink);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.02em;
  opacity: 0;
  transform: translate(-50%, -6px);
  pointer-events: none;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------- Loading ---------- */

.loading {
  position: absolute;
  inset: 0;
  z-index: 80;
  display: grid;
  place-items: center;
  background: var(--bg);
  transition: opacity 0.55s ease, visibility 0.55s ease;
}

.loading.is-hidden {
  visibility: hidden;
  opacity: 0;
}

.loading-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 220px;
  text-align: center;
}

.loading-mark {
  width: 70px;
  height: 70px;
  margin-bottom: 16px;
  filter: drop-shadow(0 10px 18px rgba(32, 53, 59, 0.16));
}

.loading-mark svg {
  display: block;
  width: 100%;
  height: 100%;
}

.loading-copy span {
  color: var(--ink-2);
  font-family: var(--serif);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.loading-copy p {
  margin: 7px 0 0;
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.loading-bar {
  position: relative;
  width: 132px;
  height: 2px;
  margin-top: 14px;
  overflow: hidden;
  background: var(--line);
}

.loading-bar i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 42%;
  background: var(--livery);
  animation: loading-slide 1.1s infinite ease-in-out;
}

.noscript {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  background: #fff;
  color: #20353b;
  font-family: var(--ui-font);
  font-size: 14px;
}

/* ---------- Motion ---------- */

@keyframes drop-in {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes deck-in {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 0.72; }
}

@keyframes loading-slide {
  0% { transform: translateX(-110%); }
  50%, 100% { transform: translateX(310%); }
}

/* ---------- Responsive ---------- */

@media (max-width: 900px) {
  .app-header {
    padding:
      calc(14px + var(--safe-top))
      calc(14px + var(--safe-right))
      0
      calc(14px + var(--safe-left));
    gap: 10px;
  }

  .brand-mark { width: 36px; height: 36px; }
  .brand { gap: 9px; }
  .brand h1 { font-size: 20px; }
  .brand-kicker { font-size: 7px; letter-spacing: 0.13em; }
  .toolbar { gap: 5px; }
  .tool-btn { width: 38px; height: 38px; border-radius: 11px; }
  .tool-btn svg { width: 17px; height: 17px; }
  .view-tool { width: 48px; }
  .palette-tool { width: 38px; }
  .palette-orb { width: 18px; height: 18px; }

  .stage-label { display: none; }

  .flight-ui {
    width: calc(100% - 20px - var(--safe-left) - var(--safe-right));
    bottom: calc(10px + var(--safe-bottom));
    gap: 6px;
  }

  .keyboard-hint { display: none; }

  .flight-deck {
    gap: 9px;
    padding: 8px;
    border-radius: 20px;
  }

  .deck-heading { gap: 5px; font-size: 7px; }
  .deck-heading b { font-size: 9px; }
  .pad-pair { gap: 5px; }
  .pad-btn { width: 49px; height: 49px; border-radius: 14px; }
  .pad-btn svg { width: 19px; height: 19px; }
  .pad-btn span { font-size: 8px; }
  .throttle-btn .plus, .throttle-btn .minus { font-size: 20px; }
  .throttle-btn span:last-child { font-size: 7px; }

  .speed-panel { width: 118px; padding: 0; }
  .speed-readout strong { font-size: 29px; }
  .speed-readout em { font-size: 6px; }
  .bank-line { display: none; }
  .throttle-line { gap: 4px; font-size: 5px; }
  .throttle-line b { min-width: 23px; font-size: 7px; }
}

@media (max-width: 420px) {
  .brand-kicker { display: none; }
  .brand h1 { font-size: 18px; }
  .brand-mark { width: 32px; height: 32px; }
  .app-header { padding-top: calc(12px + var(--safe-top)); }
  .toolbar { gap: 4px; }
  .tool-btn { width: 38px; height: 38px; border-radius: 10px; }
  .view-tool { width: 44px; }
  .palette-tool { width: 38px; }
  .flight-deck { gap: 5px; padding: 7px; border-radius: 18px; }
  .pad-btn { width: 45px; height: 45px; border-radius: 13px; }
  .pad-pair { gap: 4px; }
  .deck-heading span { display: none; }
  .speed-panel { width: 99px; }
  .speed-readout strong { font-size: 26px; }
  .speed-label { font-size: 6px; }
  .throttle-line span { display: none; }
  .throttle-line { justify-content: center; }
  .livery-grid { grid-template-columns: 1fr; }
  .livery-sheet { max-height: 78vh; padding-left: 16px; padding-right: 16px; }
}

@media (max-width: 360px) {
  .brand-mark { width: 28px; height: 28px; }
  .brand h1 { font-size: 16px; }
  .tool-btn { width: 33px; height: 33px; }
  .view-tool { width: 38px; }
  .palette-tool { width: 33px; }
  .toolbar { gap: 3px; }
  .flight-ui { width: calc(100% - 12px); }
  .flight-deck { gap: 4px; padding: 6px; }
  .pad-btn { width: 40px; height: 42px; }
  .pad-pair { gap: 3px; }
  .speed-panel { width: 86px; }
  .speed-readout strong { font-size: 24px; }
}

@media (max-height: 540px) and (orientation: landscape) {
  .app-header { padding-top: calc(9px + var(--safe-top)); }
  .brand-mark { width: 30px; height: 30px; }
  .brand h1 { font-size: 17px; }
  .brand-kicker { display: none; }
  .tool-btn { width: 34px; height: 34px; }
  .view-tool { width: 44px; }
  .flight-ui { bottom: calc(7px + var(--safe-bottom)); }
  .flight-deck { padding: 6px 10px; border-radius: 16px; }
  .deck-heading { display: none; }
  .pad-btn { width: 44px; height: 44px; border-radius: 12px; }
  .pad-btn > span:last-child { display: none; }
  .pad-btn svg { width: 18px; height: 18px; }
  .speed-panel { width: 130px; }
  .speed-readout strong { font-size: 27px; }
  .speed-label { font-size: 6px; }
  .bank-line { display: none; }
  .livery-sheet { max-height: 92vh; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

  <main class="app-shell">
    <canvas id="scene" aria-label="可驾驶的圆滚滚喷气机 3D 场景"></canvas>

    <div class="ambient-vignette" aria-hidden="true"></div>

    <div class="ui-layer">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img">
              <circle cx="24" cy="24" r="21" fill="var(--livery)"></circle>
              <path d="M23 8.5c1.8 0 2.8 1.4 3 3.3l.3 10.1 11.5 5.5c.7.3 1.1 1 1.1 1.7v2.2l-12.5-2.2-.1 5.2 4 3.1v2.2L24 38.4l-6.3 1.2v-2.2l4-3.1-.1-5.2-12.5 2.2v-2.2c0-.7.4-1.4 1.1-1.7l11.5-5.5.3-10.1c.2-1.9 1.2-3.3 3-3.3Z" fill="#263a40"></path>
              <circle cx="24" cy="14.7" r="2.2" fill="#f8e8c4"></circle>
            </svg>
          </div>
          <div class="brand-copy">
            <span class="brand-kicker">Jet Rond · 3D Flight · 3渲2 · N° 07</span>
            <h1>圆滚滚喷气机</h1>
          </div>
        </div>

        <div class="toolbar" role="group" aria-label="应用设置">
          <button id="viewCycle" class="tool-btn view-tool" type="button" aria-label="切换观看视角，当前3/4">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 8.5h3l1.6-2h6.8L17 8.5h3v9H4z"></path>
              <circle cx="12" cy="13" r="3.1"></circle>
            </svg>
            <span id="viewLabel">3/4</span>
          </button>

          <button id="orbitToggle" class="tool-btn" type="button" aria-pressed="false" aria-label="自动环绕">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19.6 11a7.7 7.7 0 1 0-2.2 5.7"></path>
              <path d="M20 5.5v5h-5"></path>
            </svg>
          </button>

          <button id="paletteToggle" class="tool-btn palette-tool" type="button" aria-expanded="false" aria-label="更换飞机配色">
            <span class="palette-orb" aria-hidden="true"></span>

            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4 6.8 6.8M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"></path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.2 14.1A8.2 8.2 0 0 1 9.9 3.8 8.4 8.4 0 1 0 20.2 14.1Z"></path>
            </svg>
          </button>
        </div>
      </header>

      <div class="stage-label" aria-hidden="true">
        <span></span>
        <b>STUDIO 01</b>
        <em>飞行甲板</em>
      </div>

      <footer class="flight-ui">
        <p class="keyboard-hint" aria-hidden="true">拖动画面环视 · 双指缩放 · W/S 油门 · A/D 转向</p>

        <section class="flight-deck" aria-label="飞行控制">
          <div class="deck-cluster turn-cluster">
            <div class="deck-heading"><span>TURN</span><b>转向</b></div>
            <div class="pad-pair">
              <button class="pad-btn" type="button" data-control="left" aria-label="左转">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M19 12H5"></path><path d="m10 7-5 5 5 5"></path>
                </svg>
                <span>左</span>
              </button>
              <button class="pad-btn" type="button" data-control="right" aria-label="右转">
                <span>右</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14"></path><path d="m14 7 5 5-5 5"></path>
                </svg>
              </button>
            </div>
          </div>

            <div class="deck-heading"><span>THRUST</span><b>油门</b></div>

                <span class="minus">−</span><span>减</span>
              </button>
              <button class="pad-btn throttle-btn" type="button" data-control="up" aria-label="加速">
                <span class="plus">+</span><span>加</span>
              </button>
            </div>
          </div>
        </section>
      </footer>
    </div>

    <div id="sheetScrim" class="sheet-scrim" aria-hidden="true"></div>
    <section id="liverySheet" class="livery-sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="liveryTitle">

      <footer class="sheet-footer">

        </div>
        <div class="loading-copy">
          <span>JET ROND · N° 07</span>
          <p>正在准备跑道…</p>
        </div>
        <div class="loading-bar"><i></i></div>
      </div>
    </div>
  </main>
